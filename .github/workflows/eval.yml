name: AI 评测

# 改提示词、技能、网关或评测本身时自动跑一次；也可以在 Actions 页面手动运行。
# 会真实调用大模型并产生费用，所以只在相关文件变动时触发，且只跑相关的评测组。
on:
  pull_request:
    paths:
      - packages/skills/**
      - packages/ai-engine/**
      - packages/experts/**
      - packages/shared/src/compliance/**
      - scripts/eval/**
      - .github/workflows/eval.yml
      - .github/scripts/eval-suites.sh
  workflow_dispatch:
    inputs:
      runs:
        description: 每个用例跑几次
        default: '3'
      provider:
        description: openai、anthropic 或 all（有密钥的都跑）；留空用仓库变量 EVAL_PROVIDER，默认 openai
        default: ''
      show_failures:
        description: 把未通过用例的模型输出（合成数据）打进日志，填 true 开启
        default: 'false'

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 省费用：PR 只跑和改动文件相关的评测组（规则见 .github/scripts/eval-suites.sh），手动运行跑全部
  plan:
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.pick.outputs.suites }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 挑选评测组
        id: pick
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files=$(git diff --name-only "$BASE"...HEAD)
          else
            files=ALL
          fi
          echo "改动的文件："; echo "$files"
          suites=$(printf '%s\n' "$files" | bash .github/scripts/eval-suites.sh)
          echo "评测组：$suites"
          echo "suites=$suites" >> "$GITHUB_OUTPUT"

  eval:
    needs: plan
    if: needs.plan.outputs.suites != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # 用例多了单个任务会超过 60 分钟，按组并行跑
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.suites) }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # 走中转服务时配置；中转里的型号名不同时用仓库变量 ANTHROPIC_MODEL 覆盖
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
    steps:
      - name: 检查密钥
        id: keys
        run: |
          if [ -z "$OPENAI_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::仓库还没有配置 OPENAI_API_KEY 或 ANTHROPIC_API_KEY，AI 评测未运行。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.keys.outputs.ready == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.keys.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.keys.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.keys.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      # 报告识别、聊天截图评测要渲染合成样本（PDF、照片、截图），需要中文字体；没有字体时这些用例都会出错
      - name: 安装中文字体
        if: steps.keys.outputs.ready == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: 运行评测
        if: steps.keys.outputs.ready == 'true'
        # 手动输入经环境变量传入，不直接拼进脚本
        env:
          # 省费用：PR 每个用例跑 1 次，手动运行默认 3 次（看稳定性）
          RUNS: ${{ inputs.runs || (github.event_name == 'pull_request' && '1' || '3') }}
          # Claude 中转暂停使用（2026-10-16 产品决定），默认只跑 OpenAI；恢复后把仓库变量 EVAL_PROVIDER 设为 all
          PROVIDER: ${{ inputs.provider || vars.EVAL_PROVIDER || 'openai' }}
          SUITE: ${{ matrix.suite }}
          # PR 上默认打出未通过用例的输出（合成数据），不用为了看原因再花钱重跑
          SHOW: ${{ (inputs.show_failures == 'true' || github.event_name == 'pull_request') && '--show-failures' || '' }}
        run: |
          case "$RUNS" in ''|*[!0-9]*) echo "runs 必须是数字"; exit 1;; esac
          if [ "$PROVIDER" != all ]; then
            pnpm eval --runs "$RUNS" --provider "$PROVIDER" --suite "$SUITE" $SHOW
          else
            pnpm eval --runs "$RUNS" --suite "$SUITE" $SHOW
          fi
      - name: 上传报告
        if: always() && steps.keys.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ strategy.job-index }}
          path: scripts/eval/eval-results/
          retention-days: 30
